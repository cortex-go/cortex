name: Hardening contract

on: [push, pull_request]

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/cortex ./cmd/cortex
      - run: node --check content/assets/js/script.js
      - run: node tests/markdown-render-smoke.js
      - run: tests/release-smoke.sh
