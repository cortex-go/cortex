name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release archives
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            os="$1"
            arch="$2"
            ext="${3:-}"
            name="cortex-${os}-${arch}"
            work="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$work/cortex${ext}" ./cmd/cortex
            cp README.md LICENSE "$work/"
            if [ "$os" = windows ]; then
              (cd "$work" && zip -q "$GITHUB_WORKSPACE/dist/${name}.zip" "cortex${ext}" README.md LICENSE)
            else
              tar -C "$work" -czf "dist/${name}.tar.gz" cortex README.md LICENSE
            fi
            rm -rf "$work"
          }
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64 .exe
          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
